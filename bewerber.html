<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbeiten in Deutschland – kostenlos bewerben | Plata</title>
  <meta name="description" content="Arbeiten in Deutschland: regulärer Arbeitsvertrag, fairer Lohn, keine Vermittlungsgebühren. Muncă în Germania · Работа в Германия · Posao u Njemačkoj.">
  <meta name="theme-color" content="#050706">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">↓</a>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
        <span data-cfg="companyName">Plata</span>
      </a>
      <div style="display:flex;align-items:center;gap:14px">
        <a href="index.html" class="header-langs" style="color:var(--muted-light);font-size:0.9rem" data-i18n="nav.employers">Für Arbeitgeber</a>
        <div class="lang-switch" role="group" aria-label="Sprache / Limba / Език / Jezik"></div>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero worker-hero">
      <div class="container">
        <span class="eyebrow" data-i18n="hero.eyebrow">Arbeiten in Deutschland</span>
        <h1 data-i18n="hero.title">Sicherer Job in Deutschland – <em>fair, legal</em> und mit Begleitung.</h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero-actions">
          <a href="#bewerbung" class="btn btn-green" data-i18n="hero.cta">Jetzt bewerben</a>
          <a data-cfg-href="whatsapp" href="#" target="_blank" rel="noopener" class="btn btn-whatsapp" data-i18n="hero.whatsapp">WhatsApp</a>
        </div>
        <p class="hero-langs"><span class="free-badge" data-i18n="hero.free">Für Bewerber 100 % kostenlos</span></p>
      </div>
    </section>

    <section class="section section-light">
      <div class="container">
        <div class="section-head">
          <div class="kicker" data-i18n="benefits.kicker"></div>
          <h2 data-i18n="benefits.title"></h2>
        </div>
        <div class="benefits">
          <div class="benefit"><h3 data-i18n="b1.t"></h3><p data-i18n="b1.d"></p></div>
          <div class="benefit"><h3 data-i18n="b2.t"></h3><p data-i18n="b2.d"></p></div>
          <div class="benefit"><h3 data-i18n="b3.t"></h3><p data-i18n="b3.d"></p></div>
          <div class="benefit"><h3 data-i18n="b4.t"></h3><p data-i18n="b4.d"></p></div>
          <div class="benefit"><h3 data-i18n="b5.t"></h3><p data-i18n="b5.d"></p></div>
          <div class="benefit"><h3 data-i18n="b6.t"></h3><p data-i18n="b6.d"></p></div>
        </div>
      </div>
    </section>

    <section class="section section-black">
      <div class="container">
        <div class="section-head">
          <div class="kicker" data-i18n="steps.kicker"></div>
          <h2 data-i18n="steps.title"></h2>
        </div>
        <div class="steps" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
          <div class="step"><h3 data-i18n="s1.t"></h3><p data-i18n="s1.d"></p></div>
          <div class="step"><h3 data-i18n="s2.t"></h3><p data-i18n="s2.d"></p></div>
          <div class="step"><h3 data-i18n="s3.t"></h3><p data-i18n="s3.d"></p></div>
          <div class="step"><h3 data-i18n="s4.t"></h3><p data-i18n="s4.d"></p></div>
        </div>
        <div class="country-group" style="margin-top:28px;border-color:var(--green)">
          <h3 data-i18n="warn.t"></h3>
          <p style="margin:0" data-i18n="warn.d"></p>
        </div>
      </div>
    </section>

    <section class="section" id="bewerbung">
      <div class="container contact-wrap">
        <div class="contact-info">
          <h2 data-i18n="contact.t"></h2>
          <p data-i18n="contact.d"></p>
          <div class="contact-lines">
            <a class="contact-line" data-cfg-href="whatsapp" href="#" target="_blank" rel="noopener">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
              <span><small>WhatsApp</small><span data-cfg="phone"></span></span>
            </a>
            <a class="contact-line" data-cfg-href="phone" href="#">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
              <span><small data-i18n="contact.call">Anrufen</small><span data-cfg="phone"></span></span>
            </a>
            <a class="contact-line" data-cfg-href="email" href="#">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
              <span><small>E-Mail</small><span data-cfg="email"></span></span>
            </a>
          </div>
        </div>

        <div class="form-card">
          <h3 data-i18n="form.title"></h3>
          <p class="sub" data-i18n="form.sub"></p>
          <div class="form-status" role="status" aria-live="polite"></div>
          <form id="worker-form" novalidate>
            <div class="form-grid">
              <div class="field full">
                <label for="w-name" data-i18n="f.name"></label>
                <input id="w-name" name="name" type="text" required autocomplete="name">
                <div class="error-msg" data-i18n="f.required"></div>
              </div>
              <div class="field">
                <label for="w-country" data-i18n="f.country"></label>
                <select id="w-country" name="country" required>
                  <option value="" data-i18n="f.select"></option>
                  <option>România</option>
                  <option>България</option>
                  <option>Hrvatska</option>
                  <option>Srbija / Србија</option>
                  <option>Bosna i Hercegovina</option>
                  <option>Северна Македонија</option>
                  <option>Shqipëria</option>
                  <option>Crna Gora</option>
                  <option>Kosova / Kosovo</option>
                  <option>Moldova</option>
                  <option value="other" data-i18n="f.country.other"></option>
                </select>
                <div class="error-msg" data-i18n="f.required"></div>
              </div>
              <div class="field">
                <label for="w-phone" data-i18n="f.phone"></label>
                <input id="w-phone" name="phone" type="tel" required autocomplete="tel" placeholder="+40 …">
                <div class="error-msg" data-i18n="f.required"></div>
              </div>
              <div class="field full">
                <label for="w-email" data-i18n="f.email"></label>
                <input id="w-email" name="email" type="email" autocomplete="email">
              </div>
              <div class="field full">
                <label for="w-job" data-i18n="f.job"></label>
                <input id="w-job" name="job" type="text" required data-i18n-ph="f.job.ph">
                <div class="error-msg" data-i18n="f.required"></div>
              </div>
              <div class="field">
                <label for="w-exp" data-i18n="f.exp"></label>
                <select id="w-exp" name="experience">
                  <option value="" data-i18n="f.select"></option>
                  <option value="<1" data-i18n="f.exp.1"></option>
                  <option value="1-3" data-i18n="f.exp.2"></option>
                  <option value="3-5" data-i18n="f.exp.3"></option>
                  <option value=">5" data-i18n="f.exp.4"></option>
                </select>
              </div>
              <div class="field">
                <label for="w-german" data-i18n="f.german"></label>
                <select id="w-german" name="german">
                  <option value="" data-i18n="f.select"></option>
                  <option value="0" data-i18n="f.german.1"></option>
                  <option value="A" data-i18n="f.german.2"></option>
                  <option value="B" data-i18n="f.german.3"></option>
                  <option value="C" data-i18n="f.german.4"></option>
                </select>
              </div>
              <div class="field full">
                <label for="w-start" data-i18n="f.start"></label>
                <select id="w-start" name="start">
                  <option value="" data-i18n="f.select"></option>
                  <option value="now" data-i18n="f.start.1"></option>
                  <option value="1-3m" data-i18n="f.start.2"></option>
                  <option value="later" data-i18n="f.start.3"></option>
                </select>
              </div>
              <div class="field full">
                <label for="w-msg" data-i18n="f.msg"></label>
                <textarea id="w-msg" name="message"></textarea>
              </div>
              <label class="consent full">
                <input type="checkbox" name="consent">
                <span><span data-i18n="f.consent"></span> <a href="datenschutz.html" data-i18n="f.privacy"></a> *</span>
              </label>
              <div class="full" style="display:grid;gap:10px">
                <button type="submit" class="btn btn-green btn-block" data-i18n="f.submit"></button>
                <button type="button" id="worker-whatsapp" class="btn btn-whatsapp btn-block" data-i18n="f.whatsapp"></button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="margin-top:0;border-top:none;padding-top:0">
        <span>© <span data-year></span> <span data-cfg="companyName">Plata</span></span>
        <span><a href="impressum.html" style="display:inline;margin-right:14px">Impressum</a><a href="datenschutz.html" style="display:inline">Datenschutz</a></span>
      </div>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
